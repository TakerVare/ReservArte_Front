services:
  # ============================
  # BASE DE DATOS - SQL Server
  # ============================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservarte_sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ReservArtePass2024(!)
      - MSSQL_PID=Express
      - MSSQL_MEMORY_LIMIT_MB=2048
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - reservarte-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ReservArtePass2024(!)' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================
  # INICIALIZACIÓN DE LA BD
  # ============================
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: reservarte_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./createDbReservArte.sql:/createDbReservArte.sql
    networks:
      - reservarte-network
    command: >
      bash -c "
      echo 'Esperando a que SQL Server esté completamente listo...' &&
      sleep 10 &&
      echo 'Ejecutando script de inicialización de base de datos...' &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'ReservArtePass2024(!)' -i /createDbReservArte.sql &&
      echo 'Base de datos ReservArteDB inicializada correctamente'
      "
    restart: "no"

  # ============================
  # BACKEND - API .NET
  # ============================
  api:
    image: gsvmm/reservarte-api:latest
    container_name: reservarte_api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__ReservArteDB=Server=sqlserver,1433;Database=ReservArteDB;User Id=sa;Password=ReservArtePass2024(!);TrustServerCertificate=True;
      - JWT__ValidAudience=http://44.222.73.155:8080
      - JWT__ValidIssuer=http://44.222.73.155:5000
      - JWT__SecretKey=MyPass@word2MyPass@word2MyPass@word2
      - Redsys__Environment=test
      - Redsys__MerchantCode=999008881
      - Redsys__Terminal=1
      - Redsys__Currency=978
      - Reminder__BaseUrl=http://44.222.73.155:5000
      - Reminder__BusinessName=ReservArte
      - Reminder__IntervalMinutes=5
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - reservarte-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dotnet --list-runtimes || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================
  # FRONTEND - Vue 3 + Nginx
  # ============================
  frontend:
    image: gsvmm/reservarte-frontend:latest
    container_name: reservarte_frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - reservarte-network
    restart: unless-stopped

networks:
  reservarte-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local